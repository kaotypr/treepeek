name: Feature request
description: Suggest something Treepeek could do, or do better.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea. Describing the problem you run into helps more than a finished
        design: there may be more than one way to solve it.
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: What you are trying to do while reviewing worktrees, and what gets in the way.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like Treepeek to do?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What do you do today instead?
      description: Workarounds, or other tools you use for this.
